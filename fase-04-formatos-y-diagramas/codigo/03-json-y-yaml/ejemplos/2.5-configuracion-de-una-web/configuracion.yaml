# Un texto de varias líneas: | conserva los saltos de línea
pie_de_correo: |
  Club de Montaña Cumbres
  Calle Mayor, 12 · Huesca

# > junta las líneas en una sola
aviso_salidas: >
  Las salidas se confirman
  el jueves anterior.
